name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Build app
        run: python -m PyInstaller --noconfirm --clean --windowed --name MonitorControl --paths src src/monitor_control_app/__main__.py

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/MonitorControl -DestinationPath MonitorControl-windows.zip -Force

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/MonitorControl.app MonitorControl-macos.zip

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: MonitorControl-windows
          path: MonitorControl-windows.zip

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: MonitorControl-macos
          path: MonitorControl-macos.zip
