[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-control-app"
version = "0.1.0"
description = "Desktop tool for switching monitor input sources through DDC/CI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "monitorcontrol>=3.1.0",
    "PySide6>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
monitor-control = "monitor_control_app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
